<title>도트시티</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Silkscreen:wght@400;700&display=swap">
<style>
/* Layout: full-bleed isometric diorama on a night-sky void; HUD chips pinned to the corners, tool rail on the left (bottom strip on phones). */
:root{
  --void:#141a30; --sky-a:#2b3a66; --sky-b:#141a30;
  --panel:#222a4a; --panel-hi:#35406c; --panel-lo:#151b33; --edge:#0b0f20;
  --ink:#eef0fa; --ink-dim:#98a1c8; --ink-faint:#5d6690;
  --gold:#ffcc4d; --gold-dk:#c98f1c;
  --res:#5fd068; --com:#49aef0; --ind:#f0b23a; --bad:#ff6b5e; --good:#7be08a;
  --f-ui:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --f-px:"Silkscreen",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--void);background-image:radial-gradient(120% 90% at 50% 38%,var(--sky-a),var(--sky-b) 70%);color:var(--ink);font-family:var(--f-ui);font-size:15px;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair;image-rendering:pixelated}
#view.pan{cursor:grab}
#view.panning{cursor:grabbing}
button{font:inherit;color:inherit}
.px{font-family:var(--f-px);letter-spacing:.02em;font-variant-numeric:tabular-nums}

/* pixel panel: notched corners + bevel */
.card{background:var(--panel);box-shadow:inset 2px 2px 0 var(--panel-hi),inset -2px -2px 0 var(--edge);clip-path:polygon(4px 0,calc(100% - 4px) 0,calc(100% - 4px) 2px,calc(100% - 2px) 2px,calc(100% - 2px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 2px) calc(100% - 4px),calc(100% - 2px) calc(100% - 2px),calc(100% - 4px) calc(100% - 2px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 2px),2px calc(100% - 2px),2px calc(100% - 4px),0 calc(100% - 4px),0 4px,2px 4px,2px 2px,4px 2px)}

.top{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:16px;right:16px;display:flex;gap:8px;align-items:stretch;pointer-events:none;flex-wrap:wrap}
.top>*{pointer-events:auto}
.city{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center;padding:8px 14px 8px 10px;min-width:0}
.rank{grid-row:1/3;display:grid;place-items:center;width:44px;height:44px;background:var(--panel-lo);box-shadow:inset 0 0 0 2px var(--gold-dk);color:var(--gold);font-size:13px;text-align:center;line-height:1.05;padding:2px}
.name{background:transparent;border:0;color:var(--ink);font:22px/1.1 var(--f-ui);width:9.5em;padding:0;outline:none;min-width:0}
.name:focus-visible{box-shadow:0 2px 0 var(--gold)}
.date{font-size:11px;color:var(--ink-dim)}
.stats{display:flex;gap:18px;align-items:center;padding:8px 16px}
.stat{display:grid;gap:2px}
.lbl{font-size:12px;color:var(--ink-dim);letter-spacing:.04em}
.stat b{font-size:15px;font-weight:400}
.stat .row{display:flex;align-items:baseline;gap:8px}
.gold{color:var(--gold)}
.neg{color:var(--bad)!important}
.delta{font-size:10px;font-style:normal;color:var(--good)}
.meter{width:84px;height:8px;background:var(--panel-lo);box-shadow:inset 0 0 0 1px var(--edge);position:relative}
.meter i{position:absolute;left:1px;top:1px;bottom:1px;background:var(--gold);width:0;max-width:calc(100% - 2px)}
.meter.hot i{background:var(--bad)}
.pwr-row{display:flex;align-items:center;gap:8px}
.pwr-row span{font-size:10px;color:var(--ink-dim)}
.ctrl{margin-left:auto;display:flex;gap:6px;align-items:center;padding:6px}
.seg{display:flex;gap:2px;background:var(--edge);padding:2px}
.ib{width:38px;height:38px;display:grid;place-items:center;background:var(--panel-lo);border:0;cursor:pointer;color:var(--ink-dim);box-shadow:inset 0 -3px 0 rgba(0,0,0,.35)}
.ib:hover{color:var(--ink);background:#1b2342}
.ib[aria-pressed="true"]{color:var(--gold);background:#2d2a4a;box-shadow:inset 0 0 0 2px var(--gold-dk),inset 0 -3px 0 rgba(0,0,0,.35)}
.ib svg{display:block}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:1px}

.tools{position:fixed;left:16px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;padding:8px}
.tgrid{display:grid;grid-template-columns:repeat(4,48px);gap:4px}
.ogrid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.ogrid .tb{width:auto;height:34px}
.ogrid .tb .k{display:none}
.tools .sep{font-size:11px;color:var(--ink-faint);letter-spacing:.12em;padding:2px 2px 0;text-align:center}
.tb.locked canvas{filter:grayscale(1) brightness(.55)}
.tb.built canvas{opacity:.4}
.tb .lk{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);font:8px var(--f-px);color:var(--gold);background:var(--edge);padding:1px 3px;display:none}
.tb.locked .lk{display:block}
.tb{width:48px;height:48px;display:grid;place-items:center;position:relative;background:var(--panel-lo);border:0;cursor:pointer;box-shadow:inset 0 -3px 0 rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.04);color:var(--ink-dim);padding:0}
.tb:hover{background:#1c2546;color:var(--ink)}
.tb[aria-pressed="true"]{background:#302c52;color:var(--gold);box-shadow:inset 0 0 0 2px var(--gold),inset 0 -3px 0 rgba(0,0,0,.4)}
.tb canvas{image-rendering:pixelated;display:block;pointer-events:none}
.tb .k{position:absolute;right:3px;top:2px;font:8px var(--f-px);color:var(--ink-faint)}
.tb[aria-pressed="true"] .k{color:var(--gold-dk)}
.tb .sw{position:absolute;left:4px;bottom:5px;width:6px;height:6px}

.rci{position:fixed;left:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;gap:14px;padding:10px 14px;align-items:stretch}
.bars{display:flex;gap:6px;align-items:stretch}
.bar{display:grid;grid-template-rows:1fr auto;gap:4px;justify-items:center}
.bar .tube{width:12px;height:64px;background:var(--panel-lo);box-shadow:inset 0 0 0 1px var(--edge);position:relative}
.bar .tube::after{content:"";position:absolute;left:0;right:0;top:31px;height:2px;background:var(--ink-faint)}
.bar .fill{position:absolute;left:2px;right:2px;height:0}
.bar span{font-size:12px}
.budget{display:grid;gap:6px;align-content:center}
.tax{display:flex;align-items:center;gap:6px}
.tax .ib{width:26px;height:26px;font:14px var(--f-px)}
.tax b{font:400 14px var(--f-px);min-width:3.2ch;text-align:center;color:var(--ink)}
.bud-line{font-size:11px;color:var(--ink-dim);display:flex;justify-content:space-between;gap:12px}
.bud-line .px{color:var(--ink)}

.mini{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);padding:8px}
.mini canvas{display:block;width:192px;height:96px;image-rendering:pixelated;cursor:pointer}
.mini .cap{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-dim);padding:0 2px 4px}

.tip{position:fixed;z-index:20;pointer-events:none;background:var(--edge);color:var(--ink);padding:8px 10px;max-width:240px;box-shadow:0 0 0 2px var(--panel-hi);font-size:14px;line-height:1.35}
.tip .h{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.tip .c{color:var(--gold);font:11px var(--f-px)}
.tip .d{color:var(--ink-dim);font-size:13px;margin-top:3px}
.tip kbd{font:9px var(--f-px);color:var(--ink-dim);border:1px solid var(--ink-faint);padding:0 3px;margin-left:6px}
.cost{position:fixed;z-index:15;pointer-events:none;font:12px var(--f-px);color:var(--gold);background:var(--edge);padding:3px 6px;box-shadow:0 0 0 2px var(--panel-hi)}
.cost.bad{color:var(--bad)}

.toasts{position:fixed;top:calc(env(safe-area-inset-top,0px) + 86px);left:50%;transform:translateX(-50%);display:grid;gap:6px;z-index:18;pointer-events:none;width:min(420px,calc(100% - 32px))}
.toast{display:flex;gap:10px;align-items:center;background:var(--panel);box-shadow:inset 2px 2px 0 var(--panel-hi),inset -2px -2px 0 var(--edge),0 0 0 2px var(--edge);padding:9px 12px;font-size:15px;animation:tin .25s steps(4) both}
.toast.out{animation:tout .3s steps(4) both}
.toast .ti{flex:none;display:grid;place-items:center;width:22px}
.toast.warn{color:#ffd8c8}
.toast.good{color:#fff2c4}
@keyframes tin{from{transform:translateY(-10px);opacity:0}to{transform:none;opacity:1}}
@keyframes tout{to{transform:translateY(-8px);opacity:0}}

.ipanel{position:fixed;right:16px;top:calc(env(safe-area-inset-top,0px) + 86px);width:236px;padding:12px 14px 14px;display:grid;gap:8px}
.ipanel h3{margin:0;font-weight:400;font-size:19px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.ipanel .sub{font-size:12px;color:var(--ink-dim);margin-top:-6px}
.ipanel .x{width:24px;height:24px;border:0;background:var(--panel-lo);color:var(--ink-dim);cursor:pointer;font:12px var(--f-px)}
.kv{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;font-size:13px;color:var(--ink-dim)}
.kv .m{height:6px;background:var(--panel-lo);position:relative}
.kv .m i{position:absolute;left:0;top:0;bottom:0}
.kv .px{font-size:10px;color:var(--ink);min-width:3ch;text-align:right}
.ipanel .need{font-size:13px;color:var(--gold);line-height:1.35}
.flags{display:flex;gap:6px;flex-wrap:wrap}
.flag{font-size:12px;padding:3px 7px;background:var(--panel-lo)}
.flag.ok{color:var(--good)}
.flag.no{color:var(--bad)}

.modal{position:fixed;inset:0;z-index:30;background:rgba(8,10,22,.72);display:grid;place-items:center;padding:16px}
.sheet{width:min(440px,100%);padding:20px 22px 22px;display:grid;gap:14px;max-height:calc(100% - 32px);overflow:auto}
.sheet h2{margin:0;font-weight:400;font-size:28px;color:var(--gold);letter-spacing:.02em}
.sheet p{margin:0;color:var(--ink-dim);line-height:1.5;font-size:15px}
.btns{display:grid;gap:8px}
.btn{border:0;cursor:pointer;background:var(--panel-lo);padding:12px 14px;text-align:left;font-size:16px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.4);display:flex;justify-content:space-between;align-items:center;gap:10px}
.btn:hover{background:#1c2546}
.btn small{color:var(--ink-dim);font-size:13px}
.btn.primary{background:var(--gold);color:#2a1d05;box-shadow:inset 0 -3px 0 var(--gold-dk)}
.btn.primary small{color:#6b4a0c}
.btn.danger{color:#ffd0c8;box-shadow:inset 0 0 0 2px var(--bad),inset 0 -3px 0 rgba(0,0,0,.4)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;color:var(--ink-dim);margin:0}
.keys dt{font:10px var(--f-px);color:var(--ink);padding-top:3px}
.keys dd{margin:0}

@media (max-width:760px){
  .top{left:12px;right:12px;gap:6px}
  .city{padding:6px 10px 6px 8px}
  .rank{width:36px;height:36px;font-size:11px}
  .name{font-size:18px}
  .city{flex:0 1 auto}
  .name{width:5em}
  .stats{gap:12px;padding:6px 12px;flex:1 1 0;justify-content:space-around}
  .ctrl{padding:4px;gap:4px;order:3;flex:1 1 100%;margin-left:0;justify-content:space-between}
  .ib{width:32px;height:32px}
  .meter{width:56px}
  .tools{top:auto;transform:none;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;flex-direction:row;gap:4px;overflow-x:auto;padding:6px;scrollbar-width:none}
  .tools::-webkit-scrollbar{display:none}
  .tools .sep{display:none}
  .tgrid,.ogrid{display:contents}
  .tb,.ogrid .tb{flex:none;width:46px;height:46px}
  .rci{left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 82px);padding:8px 10px;gap:10px}
  .bar .tube{height:44px}
  .bar .tube::after{top:21px}
  .mini{display:none}
  .ipanel{top:auto;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 82px);width:212px}
  .toasts{top:calc(env(safe-area-inset-top,0px) + 132px)}
}
@media (max-width:420px){ .ctrl .seg .ib{width:28px} .stats .pwr{display:none} }
@media (prefers-reduced-motion:reduce){ .toast,.toast.out{animation:none} }
</style>

<canvas id="view" aria-label="도시 지도"></canvas>

<header class="top">
  <section class="card city">
    <div class="rank" id="rank">개척지</div>
    <input id="cityName" class="name" maxlength="12" value="새벽시" aria-label="도시 이름" spellcheck="false">
    <div class="date px" id="date">2026.01</div>
  </section>
  <section class="card stats">
    <div class="stat"><span class="lbl">인구</span><b class="px" id="pop">0</b></div>
    <div class="stat"><span class="lbl">자금</span><div class="row"><b class="px gold" id="funds">0</b><i class="px delta" id="delta"></i></div></div>
    <div class="stat pwr"><span class="lbl">전력</span><div class="pwr-row"><div class="meter" id="pwrMeter"><i id="pwrBar"></i></div><span class="px" id="pwr">0/0</span></div></div>
  </section>
  <section class="card ctrl">
    <div class="seg" id="speed" role="group" aria-label="게임 속도"></div>
    <button class="ib" id="dayBtn" aria-label="시간대"></button>
    <button class="ib" id="sndBtn" aria-label="소리"></button>
    <button class="ib" id="menuBtn" aria-label="메뉴"></button>
  </section>
</header>

<nav class="card tools" id="tools" aria-label="도구"></nav>

<section class="card rci" aria-label="수요와 예산">
  <div class="bars">
    <div class="bar"><div class="tube"><i class="fill" id="dR"></i></div><span style="color:var(--res)">주</span></div>
    <div class="bar"><div class="tube"><i class="fill" id="dC"></i></div><span style="color:var(--com)">상</span></div>
    <div class="bar"><div class="tube"><i class="fill" id="dI"></i></div><span style="color:var(--ind)">공</span></div>
  </div>
  <div class="budget">
    <div class="tax"><span class="lbl">세율</span><button class="ib" id="taxDn" aria-label="세율 내리기">-</button><b id="tax">9%</b><button class="ib" id="taxUp" aria-label="세율 올리기">+</button></div>
    <div class="bud-line">수입 <span class="px" id="inc">0</span></div>
    <div class="bud-line">지출 <span class="px" id="exp">0</span></div>
  </div>
</section>

<div class="card mini" id="miniWrap"><div class="cap"><span>지도</span><span class="px" id="miniZoom">x2</span></div><canvas id="mini" width="192" height="96" aria-label="미니맵"></canvas></div>
<div class="tip" id="tip" hidden></div>
<div class="cost" id="cost" hidden></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<section class="card ipanel" id="info" hidden></section>

<div class="modal" id="menu" hidden>
  <div class="card sheet" role="dialog" aria-labelledby="menuTitle">
    <h2 id="menuTitle">도트시티</h2>
    <p>도로를 깔고 구역을 칠하면 사람들이 들어와 건물을 올립니다. 발전소 전기가 도로와 건물을 타고 흘러야 도시가 자랍니다. 땅값이 높은 곳에만 고층 빌딩이 섭니다.</p>
    <div class="btns">
      <button class="btn primary" id="mResume">계속하기 <small>Esc</small></button>
      <button class="btn" id="mNewTown">새 도시: 작은 마을에서 <small>기본 도시</small></button>
      <button class="btn" id="mNewEmpty">새 도시: 빈 땅에서 <small>₩30,000</small></button>
    </div>
    <dl class="keys">
      <dt>드래그</dt><dd>도로·구역 칠하기 (살펴보기 도구에선 지도 이동)</dd>
      <dt>우클릭 드래그</dt><dd>지도 이동 · 휴대폰은 두 손가락</dd>
      <dt>휠 / + -</dt><dd>확대·축소</dd>
      <dt>WASD</dt><dd>지도 이동</dd>
      <dt>SPACE</dt><dd>일시정지</dd>
      <dt>Q X R U 1-9 H J K</dt><dd>도구 선택 · P V O C T E 데이터 보기</dd>
    </dl>
  </div>
</div>

<script>
'use strict';
/* ================================================================
   DOT CITY — pixel isometric city builder
   ================================================================ */
const N=64, SLAB=12;
const K={NONE:0,ROAD:1,RES:2,COM:3,IND:4,PARK:5,POLICE:6,WIND:7,COAL:8,FIRE:9,SCHOOL:10,HALL:11,STADIUM:12,TOWER:13};
const SIZE={[K.COAL]:2,[K.SCHOOL]:2,[K.HALL]:2,[K.STADIUM]:3};const sizeOf=k=>SIZE[k]||1;
const LANDMARK={[K.HALL]:1500,[K.STADIUM]:4000,[K.TOWER]:10000};
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const fmt=n=>Math.round(n).toLocaleString('ko-KR');

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hash(x,y,s=0){let h=Math.imul(x|0,0x27d4eb2d)^Math.imul((y|0)+0x3c6ef372,0x165667b1)^Math.imul((s|0)+0x1b873593,0x9e3779b1);h=Math.imul(h^(h>>>15),0x85ebca6b);h=Math.imul(h^(h>>>13),0xc2b2ae35);h^=h>>>16;return(h>>>0)/4294967296;}

/* ---------------- palette ---------------- */
const PAL={
  g0:'#3d7534',g1:'#5a9a3e',g2:'#72b24c',g3:'#93c965',
  sand:'#e2cd8f',sand2:'#c9b173',
  w0:'#1d4a7c',w1:'#2a66a0',w2:'#4a8ccb',w3:'#8cc6ec',foam:'#e2f3fb',
  dirt:'#7b5433',dirt2:'#5c3d25',stone:'#443a52',
  asph:'#4a4e5c',side:'#bdb7aa',curb:'#8e887c',line:'#f2cb4b',white:'#f1f1ec',
  leaf0:'#2b5f35',leaf1:'#3d8143',leaf2:'#62aa51',pine0:'#1f4a36',pine1:'#2e6a48',pine2:'#4a8a5c',trunk:'#6a4428',
  glass:'#3e577c',
  zR:'#5fd068',zC:'#49aef0',zI:'#f0b23a'
};
const LIT=['#ffd27a','#ffe7ad','#ffc561','#ffdf94','#a9dbff'];
const NA=0.64, NC=[14,18,46];

function rgbOf(h){const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255];}
function pack(r,g,b,a=255){return((a&255)<<24|(b&255)<<16|(g&255)<<8|(r&255))>>>0;}
const _cc=new Map();
function col(hex,t=0,a=255){const k=hex+'|'+t+'|'+a;let v=_cc.get(k);if(v!==undefined)return v;let[r,g,b]=rgbOf(hex);
  if(t<0){const q=-t;r+=(38-r)*q;g+=(30-g)*q;b+=(72-b)*q;}else if(t>0){r+=(255-r)*t;g+=(248-g)*t;b+=(222-b)*t;}
  v=pack(Math.round(r),Math.round(g),Math.round(b),a);_cc.set(k,v);return v;}
function mixHex(a,b,t){const A=rgbOf(a),B=rgbOf(b);return'#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('');}
function nightOf(c){const r=c&255,g=c>>>8&255,b=c>>>16&255,a=c>>>24;return pack(r*(1-NA)+NC[0]*NA,g*(1-NA)+NC[1]*NA,b*(1-NA)+NC[2]*NA,a);}
function nightCss(hex,f,alpha=1){const[r,g,b]=rgbOf(hex);const k=NA*f;return`rgba(${Math.round(r*(1-k)+NC[0]*k)},${Math.round(g*(1-k)+NC[1]*k)},${Math.round(b*(1-k)+NC[2]*k)},${alpha})`;}

/* ---------------- pixel buffer: every sprite is shaded per pixel ---------------- */
class PB{
  constructor(w,h){this.w=w;this.h=h;this.d=new Uint32Array(w*h);this.n=new Uint32Array(w*h);}
  put(x,y,v){if(v==null)return;x|=0;y|=0;if(x<0||y<0||x>=this.w||y>=this.h)return;const i=y*this.w+x;
    if(typeof v==='number'){this.d[i]=v;this.n[i]=nightOf(v);}else{this.d[i]=v[0];this.n[i]=v[1]!=null?v[1]:nightOf(v[0]);}}

    const xFirst=Math.abs(b[0]-a[0])>=Math.abs(b[1]-a[1]);
    if(xFirst){while(x!==b[0]){x+=dx;out.push([x,y]);}while(y!==b[1]){y+=dy;out.push([x,y]);}}
    else{while(y!==b[1]){y+=dy;out.push([x,y]);}while(x!==b[0]){x+=dx;out.push([x,y]);}}}
  else if(t.drag==='rect'){const x0=Math.min(a[0],b[0]),x1=Math.max(a[0],b[0]),y0=Math.min(a[1],b[1]),y1=Math.max(a[1],b[1]);

    if(dayMode==='auto')W.tod=(W.tod+dt*mul*24/150)%24;}
  const td=W.tod;nightF=dayMode==='day'?0:dayMode==='night'?1:(td>=7&&td<17.5?0:td<20&&td>=17.5?(td-17.5)/2.5:td>=20||td<5?1:1-(td-5)/2);
  duskF=dayMode!=='auto'?0:Math.max(0,1-Math.abs(td-18.4)/1.5)+Math.max(0,1-Math.abs(td-6.2)/1.2);
  const pan=600*dt*DPR/cam.s*2;if(keys.has('w')||keys.has('arrowup'))cam.y-=pan;if(keys.has('s')||keys.has('arrowdown'))cam.y+=pan;if(keys.has('a')||keys.has('arrowleft'))cam.x-=pan;if(keys.has('d')||keys.has('arrowright'))cam.x+=pan;if(keys.size)clampCam();
  stepCars(dt*mul*1.1);stepParts(dt);render();updateHud(false);
  if(t-miniT>300){miniT=t;drawMini();const a=mixHex('#2b3a66','#0d1226',nightF),b=mixHex('#141a30','#070a16',nightF);document.body.style.setProperty('--sky-a',a);document.body.style.setProperty('--sky-b',b);}
  requestAnimationFrame(frame);}

function centerCam(){cam.x=0;cam.y=N*8;cam.s=Math.max(1,Math.round(2*DPR));if(innerWidth>1500)cam.s=Math.round(2.5*DPR);zoomTo(cam.s);$('#miniZoom').textContent='x'+(cam.s/DPR).toFixed(cam.s%DPR?1:0);}
function newGame(withTown){W=blankWorld((Math.random()*1e9)|0);genTerrain(W);cars=[];parts=[];selected=null;$('#info').hidden=true;
  if(withTown)starter();else{W.funds=30000;recompute();}
  $('#cityName').value=W.name;centerCam();save();updateHud(true);
  toast(withTown?'작은 마을에서 시작합니다. 도로를 깔고 구역을 칠해 도시를 키우세요.':'빈 땅입니다. 도로, 발전소, 주거 구역부터 시작하세요.','info');}
function start(data){resize();buildSprites();
  let loaded=false;
  try{const s=data&&data.save||localStorage.getItem(KEY);if(s){W=deserialize(s);recompute();loaded=true;}}catch(e){W=null;}
  if(!loaded){W=blankWorld((Math.random()*1e9)|0);genTerrain(W);starter();save();}
  buildUI();setTool('inspect');setSpeed(1);$('#cityName').value=W.name;centerCam();
  if(data&&data.cam)Object.assign(cam,data.cam);
  for(let k=0;k<40;k++)spawnCar();
  updateHud(true);drawMini();
  toast(loaded?`${W.name}에 다시 오신 걸 환영해요.`:'도로를 깔고 구역을 칠하세요. 전기가 닿으면 건물이 자랍니다.','info');
  try{window.claude?.hot?.snapshot?.(()=>({save:serialize(),cam:{...cam}}));}catch(e){}
  requestAnimationFrame(frame);}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
