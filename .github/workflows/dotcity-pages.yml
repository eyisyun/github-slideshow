# Publishes the 도트시티 web pages to GitHub Pages:
#   /            support page (App Store "지원 URL")
#   /privacy/    privacy policy (App Store "개인정보처리방침 URL")
#   /play/       the game itself, playable in any browser
# One-time setup: repository Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: dotcity pages

on:
  push:
    branches: [master]
    paths: ['site/**', 'dotcity/**', 'dotcity-app/store/screenshots/**', '.github/workflows/dotcity-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site/play _site/img
          cp -r site/. _site/
          # the public web game leaves out the era picker and test buttons, like the store app build
          node -e "const fs=require('fs');let s=fs.readFileSync('dotcity/index.html','utf8');const n=s.length;s=s.replace(/\s*<h3 class=\"msub\">[\s\S]*?<\/h3>\s*<div class=\"eras\" id=\"mEras\">[\s\S]*?<\/div>/,'');if(s.length===n){console.error('era picker markup not found');process.exit(1);}fs.writeFileSync('_site/play/index.html',s);"
          cp dotcity-app/store/screenshots/ios-*.png _site/img/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
